spring:
  application:
    name: BootHub
  datasource:
    url: jdbc:h2:file:./data/boothub
    username: sa
    password:
  # H2 콘솔은 local 프로필에서만 연다 (아래 local 문서). devtools 가 켜면 true 가 기본값이 되므로 명시적으로 끈다.
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

# 헤더 고정 외부 링크. 실제 주소는 환경변수(BOOTHUB_LINKS_SLACK / _GITHUB / _NOTION)
# 또는 git 에 올리지 않는 application-local.yaml 에서 넣는다. 값이 없으면 헤더에 비활성으로 보인다.
# 첫 관리자 계정(boothub.admin.*)은 환경변수 BOOTHUB_ADMIN_ID, BOOTHUB_ADMIN_PASSWORD 로만 받는다.
boothub:
  links:
    slack: ${BOOTHUB_LINKS_SLACK:}
    github: ${BOOTHUB_LINKS_GITHUB:}
    notion: ${BOOTHUB_LINKS_NOTION:}

---
# local 프로필 전용: 개발용 H2 콘솔 (/h2-console, ADMIN 만 — SecurityConfig.h2ConsoleFilterChain)
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
