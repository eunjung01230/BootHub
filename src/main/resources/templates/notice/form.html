<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
    <title>공지 작성 · BootHub</title>
</head>
<body>
<main class="app-main">
    <div class="page-head">
        <h1 class="page-title">공지 작성</h1>
        <p class="page-desc">필독으로 고정하면 홈 배너와 목록 맨 위에 보여요.</p>
    </div>

    <form class="card notice-form" th:action="@{/admin/notices/new}" th:object="${noticeForm}" method="post" novalidate>
        <label class="form-field">
            <span class="form-label">카테고리</span>
            <select class="form-input" th:field="*{category}" th:errorclass="is-error">
                <option value="">카테고리 선택</option>
                <option th:each="category : ${categories}" th:value="${category.name()}"
                        th:text="${category.label}">출석 관련</option>
            </select>
            <span class="form-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">오류</span>
        </label>

        <label class="form-field">
            <span class="form-label">제목</span>
            <input class="form-input" type="text" th:field="*{title}" th:errorclass="is-error"
                   maxlength="100" placeholder="제목을 입력해 주세요">
            <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">오류</span>
        </label>

        <label class="form-field">
            <span class="form-label">내용</span>
            <textarea class="form-input form-textarea" th:field="*{content}" th:errorclass="is-error"
                      maxlength="5000" placeholder="내용을 입력해 주세요"></textarea>
            <span class="form-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">오류</span>
        </label>

        <label class="form-check">
            <input type="checkbox" th:field="*{pinned}">
            필독으로 고정
        </label>

        <div class="form-actions">
            <a class="btn btn-outline" th:href="@{/notices}">취소</a>
            <button type="submit" class="btn btn-primary">등록</button>
        </div>
    </form>
</main>
</body>
</html>
