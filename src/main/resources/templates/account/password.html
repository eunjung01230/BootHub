<!DOCTYPE html>
<!--/* 본인 비밀번호 변경. forced 면 변경 전까지 다른 화면으로 갈 수 없다 (PasswordChangeRequiredFilter) */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
    <title>비밀번호 변경 · BootHub</title>
</head>
<body>
<main class="app-main">
    <div class="page-head">
        <h1 class="page-title">비밀번호 변경</h1>
        <p class="page-desc">8자 이상, 영문과 숫자를 모두 넣어 주세요. 아이디가 들어간 비밀번호는 쓸 수 없어요.</p>
    </div>

    <p class="form-notice" th:if="${forced}" role="status">
        처음 로그인했거나 비밀번호가 초기화되었어요. 새 비밀번호로 바꾼 뒤에 BootHub 를 이용할 수 있어요.
    </p>

    <form class="card admin-form" th:action="@{/account/password}" th:object="${passwordForm}" method="post" novalidate>
        <label class="form-field">
            <span class="form-label" th:text="${forced} ? '임시 비밀번호' : '현재 비밀번호'">현재 비밀번호</span>
            <input class="form-input" type="password" th:field="*{currentPassword}" th:errorclass="is-error"
                   autocomplete="current-password">
            <span class="form-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">오류</span>
        </label>

        <label class="form-field">
            <span class="form-label">새 비밀번호</span>
            <input class="form-input" type="password" th:field="*{newPassword}" th:errorclass="is-error"
                   autocomplete="new-password" minlength="8">
            <span class="form-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">오류</span>
        </label>

        <label class="form-field">
            <span class="form-label">새 비밀번호 확인</span>
            <input class="form-input" type="password" th:field="*{newPasswordConfirm}" th:errorclass="is-error"
                   autocomplete="new-password">
            <span class="form-error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}">오류</span>
        </label>

        <div class="form-actions">
            <a class="btn btn-outline" th:href="@{/}" th:unless="${forced}">취소</a>
            <button type="submit" class="btn btn-primary">변경</button>
        </div>
    </form>
</main>
</body>
</html>
