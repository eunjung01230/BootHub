<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-header" th:fragment="header">
    <a class="logo" th:href="@{/}" aria-label="BootHub 홈">
        <span class="logo-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/>
                <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>
            </svg>
        </span>
        <span class="logo-text">BootHub</span>
    </a>

    <div class="header-right">
        <!--/* 주소는 환경변수에서 온다. 설정되지 않은 링크는 비활성으로 보여준다 */-->
        <nav class="header-links" aria-label="외부 링크">
            <th:block th:each="link : ${externalLinks.all()}">
                <a class="header-link" th:if="${link.configured()}" th:href="${link.url}"
                   target="_blank" rel="noopener noreferrer" th:text="|${link.label} ↗|">Slack ↗</a>
                <span class="header-link is-disabled" th:unless="${link.configured()}"
                      title="링크가 설정되지 않았어요" th:text="${link.label}">Slack</span>
            </th:block>
        </nav>

        <div class="header-icons">
            <a class="header-icon" th:href="@{/notices}" title="공지" aria-label="공지">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                    <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
            </a>
        </div>

        <div class="header-user" th:if="${loginUser != null}">
            <span class="header-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="10" r="3"/>
                    <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/>
                </svg>
            </span>
            <span class="header-user-name" th:text="${loginUser.name}">홍길동</span>
            <span class="header-user-role" th:text="${loginUser.roleLabel}">수강생</span>
            <form class="header-logout" th:action="@{/logout}" method="post">
                <button type="submit" class="header-logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
