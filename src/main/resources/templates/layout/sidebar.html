<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="app-sidebar" th:fragment="sidebar">
    <nav aria-label="주 메뉴">

        <!-- 홈 -->
        <a class="nav-top" th:href="@{/}"
           th:classappend="${currentPath == '/'} ? 'is-active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
            </svg>
            홈
        </a>

        <!-- 공지 센터 (4단계에서 구현) -->
        <p class="nav-group-title">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 11 18-5v12L3 14v-3z"/>
                <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
            </svg>
            공지 센터
        </p>
        <ul class="nav-list">
            <li><a class="nav-sub" th:href="@{/notices}"
                   th:classappend="${currentPath == '/notices' and param.category == null} ? 'is-active'">전체 공지</a></li>
            <li><a class="nav-sub" th:href="@{/notices(category='ATTENDANCE')}"
                   th:classappend="${currentPath == '/notices' and param.category != null and param.category[0] == 'ATTENDANCE'} ? 'is-active'">출석 관련</a></li>
            <li><a class="nav-sub" th:href="@{/notices(category='EVALUATION')}"
                   th:classappend="${currentPath == '/notices' and param.category != null and param.category[0] == 'EVALUATION'} ? 'is-active'">평가 관련</a></li>
            <li><a class="nav-sub" th:href="@{/notices(category='CURRICULUM')}"
                   th:classappend="${currentPath == '/notices' and param.category != null and param.category[0] == 'CURRICULUM'} ? 'is-active'">커리큘럼</a></li>
            <li><a class="nav-sub" th:href="@{/notices(category='CONTACT')}"
                   th:classappend="${currentPath == '/notices' and param.category != null and param.category[0] == 'CONTACT'} ? 'is-active'">연락처</a></li>
            <li><a class="nav-sub" th:href="@{/notices(category='QNA')}"
                   th:classappend="${currentPath == '/notices' and param.category != null and param.category[0] == 'QNA'} ? 'is-active'">공지 Q&amp;A</a></li>
        </ul>

        <hr class="nav-divider">

        <!-- 공동 학습 (수업 캘린더 외에는 v2 → 준비 중 페이지) -->
        <p class="nav-group-title">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/>
                <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>
            </svg>
            공동 학습
        </p>
        <ul class="nav-list">
            <li><a class="nav-sub" th:href="@{/#calendar}">수업 캘린더</a></li>
            <li><a class="nav-sub" th:href="@{/coming-soon(feature='mini-project')}"
                   th:classappend="${currentPath == '/coming-soon' and param.feature != null and param.feature[0] == 'mini-project'} ? 'is-active'">미니 프로젝트</a></li>
            <li><a class="nav-sub" th:href="@{/coming-soon(feature='showcase')}"
                   th:classappend="${currentPath == '/coming-soon' and param.feature != null and param.feature[0] == 'showcase'} ? 'is-active'">프로젝트 전시관</a></li>
            <li><a class="nav-sub" th:href="@{/coming-soon(feature='chat')}"
                   th:classappend="${currentPath == '/coming-soon' and param.feature != null and param.feature[0] == 'chat'} ? 'is-active'">번개 학습방</a></li>
            <li><a class="nav-sub" th:href="@{/coming-soon(feature='qna')}"
                   th:classappend="${currentPath == '/coming-soon' and param.feature != null and param.feature[0] == 'qna'} ? 'is-active'">학습 Q&amp;A</a></li>
        </ul>

        <hr class="nav-divider">

        <!-- 관리자 (2단계에서 권한별 노출 처리) -->
        <a class="nav-top" th:href="@{/admin/lessons}"
           th:classappend="${#strings.startsWith(currentPath, '/admin')} ? 'is-active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            관리자
        </a>
    </nav>
</aside>
</body>
</html>
