<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
    <title>계정 생성 · BootHub</title>
</head>
<body>
<main class="app-main">
    <a class="text-link back-link" th:href="@{/admin/members}">← 회원 관리로</a>

    <div class="page-head">
        <h1 class="page-title">계정 생성</h1>
        <p class="page-desc">비밀번호는 시스템이 만들어 다음 화면에 한 번만 보여줘요.</p>
    </div>

    <form class="card admin-form" th:action="@{/admin/members/new}" th:object="${memberForm}" method="post" novalidate>
        <label class="form-field">
            <span class="form-label">아이디</span>
            <input class="form-input is-mono" type="text" th:field="*{loginId}" th:errorclass="is-error"
                   maxlength="20" autocomplete="off" placeholder="예: s3-017">
            <span class="form-hint">역할-기수-번호 · 수강생 s3-017 · 강사 t3-01 · 교수 p3-01 · 만든 뒤에는 바꿀 수 없어요</span>
            <span class="form-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">오류</span>
        </label>

        <label class="form-field">
            <span class="form-label">실명</span>
            <input class="form-input" type="text" th:field="*{name}" th:errorclass="is-error"
                   maxlength="30" autocomplete="off" placeholder="화면에 보이는 이름">
            <span class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">오류</span>
        </label>

        <label class="form-field">
            <span class="form-label">역할</span>
            <select class="form-input" th:field="*{role}" th:errorclass="is-error">
                <option value="">역할 선택</option>
                <option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.label}">수강생</option>
            </select>
            <span class="form-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">오류</span>
        </label>

        <div class="form-actions">
            <a class="btn btn-outline" th:href="@{/admin/members}">취소</a>
            <button type="submit" class="btn btn-primary">생성하고 비밀번호 발급</button>
        </div>
    </form>
</main>
</body>
</html>
