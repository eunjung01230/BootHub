<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
    <title>회원 관리 · BootHub</title>
</head>
<body>
<main class="app-main">
    <div class="page-head page-head-row">
        <div>
            <h1 class="page-title">회원 관리</h1>
            <p class="page-desc">회원가입은 없어요. 여기서 발급한 계정으로만 로그인할 수 있어요.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/members/new}">계정 생성</a>
    </div>

    <!--/* 방금 발급·초기화한 임시 비밀번호. flash 로 한 번만 넘어오고 저장되지 않는다 */-->
    <section class="card issued-password" th:if="${issuedPassword != null}" role="status">
        <p class="issued-password-head">
            <strong th:text="|${issuedPassword.name} (${issuedPassword.loginId})|">김민준 (s3-017)</strong>
            계정의 임시 비밀번호를 <span th:text="${issuedPassword.action}">발급</span>했어요.
        </p>
        <p class="issued-password-value" th:text="${issuedPassword.password}">Ab3dEf7hJk</p>
        <p class="issued-password-help">
            이 화면을 벗어나면 다시 볼 수 없어요. 지금 본인에게 전달해 주세요.
            첫 로그인 때 새 비밀번호로 바꾸게 돼요.
        </p>
    </section>

    <section class="card table-card">
        <div class="table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th scope="col">아이디</th>
                    <th scope="col">실명</th>
                    <th scope="col">역할</th>
                    <th scope="col">상태</th>
                    <th scope="col">생성일</th>
                    <th scope="col" class="is-action"><span class="sr-only">관리</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${members}" th:classappend="${!member.active} ? 'is-inactive'">
                    <td class="is-nowrap is-mono" th:text="${member.loginId}">s3-017</td>
                    <td class="is-nowrap">
                        <span th:text="${member.name}">김민준</span>
                        <span class="badge" th:if="${member.self}">나</span>
                    </td>
                    <td class="is-nowrap" th:text="${member.roleLabel}">수강생</td>
                    <td>
                        <span class="badge-row">
                            <span class="badge is-green" th:if="${member.active}">사용 중</span>
                            <span class="badge is-muted" th:unless="${member.active}">비활성</span>
                            <span class="badge is-pink" th:if="${member.active and member.mustChangePassword}">비밀번호 변경 필요</span>
                        </span>
                    </td>
                    <td class="is-nowrap" th:text="${member.createdDate}">2026.11.19</td>
                    <td class="is-action">
                        <div class="row-actions" th:if="${member.active}">
                            <form th:action="@{/admin/members/{id}/reset-password(id=${member.id})}" method="post"
                                  onsubmit="return confirm('임시 비밀번호를 새로 발급할까요? 지금 비밀번호는 더 이상 쓸 수 없어요.');">
                                <button type="submit" class="btn btn-outline btn-sm">비밀번호 초기화</button>
                            </form>
                            <form th:unless="${member.self}"
                                  th:action="@{/admin/members/{id}/deactivate(id=${member.id})}" method="post"
                                  onsubmit="return confirm('이 계정을 비활성화할까요? 이후 로그인할 수 없어요.');">
                                <button type="submit" class="btn btn-outline btn-sm is-danger">비활성화</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
